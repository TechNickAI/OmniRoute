name: Build Standalone Artifact (self-hosted deploy)

# Builds the Next.js standalone bundle on a FREE GitHub-hosted arm64 runner
# (4 vCPU / 16 GB) so we never run the RAM-hungry build on the live router.
#
# Why this exists: building in place on the router (r8g.large, 2 vCPU/16 GB)
# takes the whole fleet down — `npm run build:release` does `rm -rf .build dist`
# (deleting the running service's WorkingDirectory) and the compile drives the
# box to 98% memory + 100% swap. See the omnirouter skill.
#
# Runtime RSS of the router is only ~1.2 GB; 16 GB was provisioned solely for
# the build. Moving the build here lets the instance be downsized.
#
# Produces: omniroute-standalone-<sha>.tar.zst  (.build/ + dist/)
# Consume with:  gh run download <run-id> -n omniroute-standalone-<sha>

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/SHA to build"
        required: true
        default: nick/upgrade-v3.8.49-plus-fork
  push:
    branches:
      - "nick/upgrade-*"

permissions:
  contents: read

concurrency:
  group: standalone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # arm64 to match the router (aarch64). Free for public repos.
    # Native modules (better-sqlite3, sharp) MUST be built for linux/arm64 —
    # a macOS build produces sharp-darwin-arm64 and won't load on the router.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          persist-credentials: false

      - name: Report runner resources
        run: |
          echo "arch: $(uname -m)  kernel: $(uname -r)"
          echo "cores: $(nproc)"
          free -h
          df -h / | tail -1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # Exactly as the host runbook (/home/ubuntu/CLAUDE.md) prescribes:
      # npm ci (never pnpm — phantom hoisted deps like remark-gfm break),
      # --legacy-peer-deps, --ignore-scripts.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps --ignore-scripts

      # better-sqlite3 is a native arm64 binding and is skipped by
      # --ignore-scripts above, so it must be rebuilt explicitly.
      - name: Rebuild native modules
        run: npm rebuild better-sqlite3

      # CRITICAL: webpack, NOT Turbopack. Turbopack's native memory exceeds
      # 8 GB and OOMs; webpack peaks ~11 GB. `npm run build:release` invokes
      # `next build --turbopack` even with OMNIROUTE_USE_TURBOPACK=0 in .env,
      # so we call `npm run build` with the flag set explicitly and then assert
      # on the banner below.
      - name: Build (webpack)
        env:
          OMNIROUTE_USE_TURBOPACK: "0"
          NEXT_PUBLIC_BASE_URL: https://omniroute.technick.ai
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log

      - name: Assert webpack was used (fail if Turbopack sneaked in)
        run: |
          if grep -qi "turbopack" /tmp/build.log; then
            echo "::error::Turbopack was used — it OOMs the router. Build rejected."
            grep -i turbopack /tmp/build.log | head -5
            exit 1
          fi
          echo "OK: no Turbopack in build log"

      - name: Build CLI + write BUILD_SHA
        env:
          OMNIROUTE_BUILD_SHA: ${{ github.sha }}
        run: |
          npm run build:cli
          node scripts/build/write-build-sha.mjs || {
            mkdir -p dist
            git rev-parse --short HEAD > dist/BUILD_SHA
          }
          echo "BUILD_SHA=$(cat dist/BUILD_SHA 2>/dev/null || echo unknown)"

      - name: Verify artifact shape before packaging
        run: |
          fail=0
          [ -s .build/next/standalone/server.js ] || { echo "::error::missing .build/next/standalone/server.js"; fail=1; }
          [ -f .build/next/standalone/dev/run-standalone.mjs ] \
            || echo "::warning::dev/run-standalone.mjs not in standalone (service entrypoint) — check unit file"
          # Native module must be the LINUX arm64 build, not darwin
          find .build -name "better_sqlite3.node" | head -3
          if find .build -path "*sharp-darwin*" | grep -q .; then
            echo "::error::sharp-darwin-* present — wrong platform build"; fail=1
          fi
          find .build -maxdepth 4 -name "sharp-linux-arm64" -o -maxdepth 4 -name "sharp-linuxmusl-arm64" | head -3
          # Fork patch must have survived the build
          if grep -rq "cc_entrypoint" .build/next/standalone 2>/dev/null; then
            echo "OK: fork CLAUDE_CC_ENTRYPOINT patch present in bundle"
          else
            echo "::error::fork patch (cc_entrypoint) missing from built bundle"; fail=1
          fi
          echo "standalone size: $(du -sh .build | cut -f1)"
          exit $fail

      - name: Package
        id: pack
        run: |
          SHORT=$(git rev-parse --short HEAD)
          NAME="omniroute-standalone-${SHORT}"
          tar --zstd -cf "${NAME}.tar.zst" .build dist
          ls -lh "${NAME}.tar.zst"
          sha256sum "${NAME}.tar.zst" > "${NAME}.tar.zst.sha256"
          cat "${NAME}.tar.zst.sha256"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: |
            ${{ steps.pack.outputs.name }}.tar.zst
            ${{ steps.pack.outputs.name }}.tar.zst.sha256
          retention-days: 14
          compression-level: 0 # already zstd-compressed

      - name: Summary
        run: |
          {
            echo "### Standalone artifact built"
            echo ""
            echo "- ref: \`${{ github.event.inputs.ref || github.ref }}\`"
            echo "- sha: \`${{ steps.pack.outputs.short }}\`"
            echo "- artifact: \`${{ steps.pack.outputs.name }}\`"
            echo ""
            echo "Deploy (does NOT touch the live service):"
            echo '```bash'
            echo "gh run download ${{ github.run_id }} -n ${{ steps.pack.outputs.name }} -D /tmp/omr"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
