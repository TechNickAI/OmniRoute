# Build the OmniRoute standalone bundle in CI instead of on the live router.
#
# The router (r8g.large, 2 vCPU / 16 GB aarch64) cannot build safely: an in-place
# build caused a ~30 min fleet outage on 2026-07-26. Runtime RSS is ~1.2 GB while
# the build peaks near 15 GB, and `build:release` deletes `.build` — which is the
# live systemd WorkingDirectory.
#
# This builds on a free arm64 runner (public repo), asserts the correct bundler,
# and uploads a tarball the host unpacks into a NEW release dir.

name: Build Standalone Artifact

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/SHA to build"
        required: true
        default: release/v3.8.50
  push:
    branches:
      - "release/v3.8.50"

permissions:
  contents: read

concurrency:
  group: standalone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # MUST match the router: Linux aarch64. A macOS build emits sharp-darwin-*
    # and Darwin better_sqlite3.node, which will not load there.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          persist-credentials: false

      - name: Report runner resources
        run: |
          echo "arch: $(uname -m)  cores: $(nproc)"
          free -h

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # Mirrors the router runbook's documented flags exactly.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --legacy-peer-deps --ignore-scripts

      - name: Rebuild native modules
        run: npm rebuild better-sqlite3

      # Call `npm run build` directly, never `build:release` — that script begins
      # with `rm -rf .build dist`, which on the host deletes the running service's
      # working directory. Here it would only be wasteful, but keeping the same
      # command everywhere avoids the habit.
      - name: Build
        env:
          OMNIROUTE_USE_TURBOPACK: "0"
          NEXT_PUBLIC_BASE_URL: https://omniroute.technick.ai
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -o pipefail
          OMNIROUTE_BUILD_SHA=$(git rev-parse --short HEAD) npm run build 2>&1 | tee /tmp/build.log

      # Load-bearing. The project's own release script has previously ignored
      # OMNIROUTE_USE_TURBOPACK=0 and invoked Turbopack anyway, which OOMs the
      # router. Fail here rather than ship that bundle.
      - name: Assert the safe bundler was used
        run: |
          if grep -qi "turbopack" /tmp/build.log; then
            echo "::error::Turbopack used — it OOMs the target host. Rejected."
            grep -i turbopack /tmp/build.log | head -5
            exit 1
          fi
          echo "OK: webpack build confirmed"

      - name: Build CLI
        run: npm run build:cli

      # Catch platform and patch problems here, not on the production box.
      - name: Verify artifact shape
        run: |
          fail=0
          [ -s .build/next/standalone/server.js ] || { echo "::error::missing server.js"; fail=1; }
          if find .build -path "*sharp-darwin*" | grep -q .; then
            echo "::error::darwin native modules present — wrong build platform"; fail=1
          fi
          if find .build -name "*.node" | head -1 | grep -q .; then
            echo "native modules present: $(find .build -name '*.node' | wc -l)"
          else
            echo "::error::no native modules in bundle"; fail=1
          fi
          # Assert our fork's fixes actually survived into the bundle.
          if grep -rqs "isStreamEarlyEof" .build/next/standalone 2>/dev/null; then
            echo "OK: STREAM_EARLY_EOF breaker fix present in bundle"
          else
            echo "::error::fork fix (isStreamEarlyEof) missing from bundle"; fail=1
          fi
          if grep -rqsF "no such (module|table): dbstat" .build/next/standalone 2>/dev/null; then
            echo "OK: dbstat guard present in bundle"
          else
            echo "::error::dbstat guard missing from bundle"; fail=1
          fi
          if grep -rqsF "CLAUDE_CC_ENTRYPOINT" .build/next/standalone 2>/dev/null; then
            echo "OK: Claude entrypoint override present in bundle"
          else
            echo "::error::CLAUDE_CC_ENTRYPOINT missing from bundle"; fail=1
          fi
          exit $fail

      - name: Package
        id: pack
        run: |
          SHORT=$(git rev-parse --short HEAD)
          NAME="standalone-${SHORT}"
          tar --zstd -cf "${NAME}.tar.zst" .build dist
          sha256sum "${NAME}.tar.zst" > "${NAME}.tar.zst.sha256"
          ls -lh "${NAME}.tar.zst"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: |
            ${{ steps.pack.outputs.name }}.tar.zst
            ${{ steps.pack.outputs.name }}.tar.zst.sha256
          retention-days: 14
          compression-level: 0
